name: iOS Build
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen 2>/dev/null || true

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build & Archive
        run: |
          xcodebuild -project AperturePro.xcodeproj \
            -scheme AperturePro \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            build \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tail -50

      - name: Archive
        run: |
          xcodebuild -project AperturePro.xcodeproj \
            -scheme AperturePro \
            -configuration Release \
            -archivePath build/AperturePro.xcarchive \
            archive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tail -50

      - name: Export Unsigned IPA
        run: |
          if [ -d "build/AperturePro.xcarchive" ]; then
            cd build/AperturePro.xcarchive/Products
            mkdir -p Payload
            cp -r AperturePro.app Payload/
            zip -r /workspace/AperturePro-unsigned.ipa Payload/
            echo "✅ IPA exported: $(ls -lh /workspace/AperturePro-unsigned.ipa)"
          else
            echo "⚠️ 未找到 archive，检查编译日志"
            exit 1
          fi

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AperturePro-unsigned.ipa
          path: /workspace/AperturePro-unsigned.ipa

      - name: Verify Binary
        run: |
          echo "=== 二进制核验 ==="
          BINARY=$(find build -name "AperturePro" -type f 2>/dev/null | head -1)
          if [ -n "$BINARY" ]; then
            echo "Binary: $BINARY ($(wc -c < "$BINARY") bytes)"
            python3 -c "
          import subprocess
          r = subprocess.run(['strings', '-a', '$BINARY'], capture_output=True, text=True)
          checks = ['光圈', '拍照', '录像', '滤镜', '相机', '频闪', 'AR']
          for c in checks:
              count = r.stdout.count(c)
              print(f'  {c}: {count}')
          "
          fi
