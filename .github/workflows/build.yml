name: Build IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Archive
        run: |
          mkdir -p logs
          xcodebuild -project AperturePro.xcodeproj \
            -scheme AperturePro \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/AperturePro.xcarchive \
            archive \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            > logs/archive.log 2>&1
          RC=$?
          echo "=== archive RC=$RC ==="
          echo "--- 错误行（最多 60 条）---"
          grep -E "error:" logs/archive.log | head -60 || true
          echo "--- 结尾 25 行 ---"
          tail -25 logs/archive.log
          exit $RC

      - name: Export IPA
        run: |
          mkdir -p build/ipa
          xcodebuild -exportArchive \
            -archivePath build/AperturePro.xcarchive \
            -exportPath build/ipa \
            -exportOptionsPlist export.plist \
            > logs/export.log 2>&1 || true
          if ls build/ipa/*.ipa >/dev/null 2>&1; then
            echo "export ok"
          else
            echo "export failed, fallback to Payload zip"
            mkdir -p build/ipa/Payload
            cp -R build/AperturePro.xcarchive/Products/Applications/*.app build/ipa/Payload/
            (cd build/ipa && zip -qry AperturePro-unsigned.ipa Payload)
          fi
          ls -la build/ipa/

      - name: Verify Binary
        run: |
          mkdir -p verify
          APP=$(find build/AperturePro.xcarchive/Products/Applications -name '*.app' -maxdepth 1 | head -1)
          BIN=$(find "$APP" -type f -perm +111 -name 'AperturePro' | head -1)
          cp "$BIN" verify/AperturePro
          python3 -c "
          import plistlib, sys, pathlib
          app = pathlib.Path('''$APP''')
          info = plistlib.loads((app / 'Info.plist').read_bytes())
          print('bundle:', info.get('CFBundleIdentifier'))
          print('version:', info.get('CFBundleShortVersionString'), info.get('CFBundleVersion'))
          data = pathlib.Path('verify/AperturePro').read_bytes()
          for s in ['光圈专业版','胶片模拟','延时摄影','全景拼接']:
              b = s.encode('utf-8')
              print(('OK  ' if b in data else 'MISS'), s)
          "

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: logs/
          if-no-files-found: ignore

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AperturePro-IPA
          path: build/ipa/*.ipa
          if-no-files-found: ignore
