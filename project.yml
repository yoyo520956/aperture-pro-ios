name: AperturePro
options:
  bundleIdPrefix: com.aperture.pro
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

targets:
  AperturePro:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Sources/App/Info.plist
      properties:
        CFBundleDisplayName: 光圈Pro
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1.0.0(20261026.01)"
        UILaunchScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSCameraUsageDescription: 光圈Pro 需要使用相机来拍照和录像
        NSMicrophoneUsageDescription: 光圈Pro 需要使用麦克风来录制视频声音
        NSPhotoLibraryAddUsageDescription: 光圈Pro 需要访问相册来保存照片和视频
        NSPhotoLibraryUsageDescription: 光圈Pro 需要访问相册来选择和编辑照片
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes:
          - audio
          - fetch
        NSUbiquitousContainers:
          "$(CONTAINER_IDENTIFIER)_Documents":
            NSUbiquitousContainerIsolationDomain: NSUbiquitousContainerIsolationDomainiCloud
            NSUbiquitousContainerName: 光圈Pro
            NSUbiquitousContainerMaximumSyncableItems: 1000
        UIUserInterfaceStyle: Automatic
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - aperturepro
        NSLocalNetworkUsageDescription: 光圈Pro 需要在局域网中共享相机画面（IP推流）
        NSBonjourServices:
          - _aperturepro._tcp
    buildSettings:
      PRODUCT_BUNDLE_IDENTIFIER: com.aperture.pro
      MARKETING_VERSION: "1.0.0"
      CURRENT_PROJECT_VERSION: "1.0.0(20261026.01)"
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      SWIFT_VERSION: "5.9"
      TARGETED_DEVICE_FAMILY: "1,2"
      ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
      GENERATE_INFOPLIST_FILE: NO
      INFOPLIST_FILE: Sources/App/Info.plist
      ENABLE_MODULE_DEBUGGING: NO
      ENABLE_USER_SCRIPT_SANDBOXING: NO
      SWIFT_OBJC_BRIDGING_HEADER: ""
      CODE_SIGNING_REQUIRED: NO
      CODE_SIGN_IDENTITY: ""
      CODE_SIGNING_ALLOWED: NO

schemes:
  AperturePro:
    build:
      targets:
        AperturePro: all
    run:
      config: Debug
